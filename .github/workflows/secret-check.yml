
name: Secret Check

on: push

jobs:
  secret-check:
    runs-on: ubuntu-latest

    steps:
      - name: Verify APP_TOKEN is available
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "APP_TOKEN is configured successfully"
          else
            echo "APP_TOKEN is missing"
            exit 1
          fi
