name: env-demo
on: push
env: 
  APP_NAME: journey
jobs:
  build:
    runs-on: ubuntu-latest
    env:
     LOG_LEVEL: info
    steps:
      - name: Default job env
        run: echo "$APP_NAME with log level $LOG_LEVEL"
      - name: Verbose step
        env :
          LOG_LEVEL: debug
        run: echo "$APP_NAME with log level $LOG_LEVEL"
  
